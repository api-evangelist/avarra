  header: 'Authorization: Bearer <token>'
  token_endpoint: https://api.avarra.ai/oauth/token
  detail: authentication/avarra-authentication.yml
versioning:
  scheme: uri-path
  current: v1
  evidence: >-
    Every path under https://api.avarra.ai/v1/ reaches the application and returns the
    JSON 401 envelope; /v2 is rejected at the load balancer with a 403 "Access denied",
    so v1 is the only routed version.
  policy_url: null
  header_negotiation: false
error_envelope:
  format: custom-json
  rfc9457: false
  content_type: application/json
  resource_shape:
    fields:
    - error
    - message
    example: '{"error":"unauthorized","message":"missing or invalid authorization header"}'
  oauth_shape:
    spec: RFC 6749 section 5.2
    fields:
    - error
    - error_description
    example: '{"error":"invalid_request","error_description":"missing client credentials"}'
  note: >-
    Two different envelopes coexist. The OAuth endpoints use the standard RFC 6749
    error/error_description pair; the /v1 resource endpoints use a non-standard
    error/message pair. Neither is application/problem+json.
  detail: errors/avarra-problem-types.yml
edge_behaviour:
  load_balancer: awselb/2.0
  unrouted_path_status: 403
  unrouted_path_body: Access denied
  unrouted_path_content_type: text/plain; charset=utf-8
  note: >-
    Paths outside the routed surface (/, /docs, /openapi.json, /graphql, /mcp,
    /llms.txt, /api, /webhooks, /events, /v2) are refused by the AWS load balancer
    with a plain-text 403 before reaching the application. A 403 here is a routing
    result, not an authorization result, and must not be read as "the resource exists
    but you lack permission".
