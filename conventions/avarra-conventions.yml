source: live responses from https://api.avarra.ai on 2026-08-14
note: >-
  Avarra publishes no API documentation and no OpenAPI, so these conventions are
  derived entirely from what the production API host actually returned to
  unauthenticated requests. Anything that cannot be observed without a credential is
  recorded as unknown rather than guessed - in particular pagination, expansion,
  metadata and idempotency, none of which are visible from outside the auth wall.
authentication:
