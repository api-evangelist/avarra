name: Avarra
description: >-
  Avarra is an AI-powered sales training and enablement platform, operated by Ramp
  Systems, Inc., that helps revenue teams onboard, coach, and certify sales
  representatives at scale. The platform turns real sales conversations into
  AI-avatar role-play simulations delivered over Zoom, gives reps unlimited practice
  reps with instant coaching feedback, standardizes sales methodology across teams and
  regions, and reports certification and performance analytics through manager
  dashboards. Its workflow moves through five stages: Capture, Train, Practice,
  Certify, and Performance Insights, with the stated goal of cutting new-hire ramp
  time in half. Avarra is a Lightspeed Venture Partners portfolio company that exited
  stealth with $8M in seed funding. Avarra runs a production API at api.avarra.ai that
  publishes RFC 8414 OAuth 2.0 authorization server metadata and an RFC 7517 JWKS
  anonymously, but the entire /v1 resource surface is closed behind OAuth 2.0
  client-credentials access and the company publishes no OpenAPI, developer portal,
  API reference, SDKs, or pricing.
