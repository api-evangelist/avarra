name: Avarra
description: >-
  Avarra is an AI-powered sales training and enablement platform that helps
  revenue teams onboard, coach, and certify sales representatives at scale. The
  platform turns real sales conversations into AI-driven role-play simulations,
  delivers personalized coaching feedback, standardizes sales methodology across
  teams and regions, and reports certification and performance analytics. Its
  workflow moves through five stages: Capture, Train, Practice, Certify, and
  Performance Insights, with the stated goal of cutting new-hire ramp time in
  half. Avarra is a Lightspeed Venture Partners portfolio company. As of this
  profile Avarra publishes a marketing and product site but no public developer
  API, documentation portal, or SDKs.
